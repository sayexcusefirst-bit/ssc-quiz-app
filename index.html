<!DOCTYPE html>
<html>
<head>
  <title>SSC Quiz App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>

<div class="app">
  <h2>SSC Daily Practice</h2>

  <select id="subjectSelect" onchange="changeSubject()">
    <option value="history">History</option>
    <option value="polity">Polity</option>
  </select>

  <div class="top-bar">
    <span id="timer">⏱ 0s</span>
    <span id="score">Score: 0</span>
  </div>

  <div class="progress"><div id="progress-bar"></div></div>

  <p id="question"></p>
  <div id="options"></div>

  <div id="feedback"></div>
  <div id="solution"></div>

  <button id="nextBtn" onclick="nextQuestion()">Next</button>
</div>

<script src="questions.js"></script>
<script>
let subject = "history";
let questions = data[subject];
let current = 0, score = 0, time = 0;

setInterval(() => {
  time++;
  document.getElementById("timer").innerText = "⏱ " + time + "s";
}, 1000);

function changeSubject() {
  subject = document.getElementById("subjectSelect").value;
  questions = data[subject];
  current = score = time = 0;
  loadQuestion();
}

function loadQuestion() {
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("solution").innerHTML = "";
  document.getElementById("nextBtn").style.display = "none";

  const q = questions[current];
  document.getElementById("question").innerText = q.question;

  const optionsDiv = document.getElementById("options");
  optionsDiv.innerHTML = "";
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.innerText = opt;
    btn.onclick = () => checkAnswer(i);
    optionsDiv.appendChild(btn);
  });

  document.getElementById("progress-bar").style.width =
    (current / questions.length) * 100 + "%";
}

function checkAnswer(i) {
  if (i === questions[current].answer) {
    score++;
    document.getElementById("feedback").innerText = "✅ Correct";
  } else {
    document.getElementById("feedback").innerText = "❌ Wrong";
  }
  document.getElementById("score").innerText = "Score: " + score;
  document.getElementById("solution").innerText = questions[current].solution;
  document.getElementById("nextBtn").style.display = "block";
}

function nextQuestion() {
  current++;
  if (current < questions.length) loadQuestion();
}

loadQuestion();
</script>
</body>
</html>
