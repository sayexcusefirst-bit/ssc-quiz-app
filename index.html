<!DOCTYPE html>
<html>
<head>
  <title>SSC Quiz App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>

<div class="app">
  <h2>keep practicing keep smiling</h2>

  <button id="pyqBtn" class="pyq-btn">📜 PYQ MODE</button>
  <button id="backBtn" class="back-btn" style="display:none;">⬅ Back to Subjects</button>

  <select id="subjectSelect">
    <option value="history">History</option>
    <option value="polity">Polity</option>
    <option value="geography">Geography</option>
    <option value="economy">Economy</option>
    <option value="science">Science</option>
  </select>

  <div class="top-bar">
    <span id="timer">⏱ 0s</span>
    <span id="score">Score: 0</span>
  </div>

  <div class="progress">
    <div id="progress-bar"></div>
  </div>

  <p id="question"></p>
  <div id="options"></div>

  <div id="feedback"></div>
  <div id="solution"></div>

  <button id="nextBtn" style="display:none;">Next</button>
</div>

<script src="questions.js"></script>
<script>
/* ----------------- GLOBALS ----------------- */
let subject = "history";
let questions = [];
let current = 0;
let score = 0;
let time = 0;
let attempted = 0;
let wrong = 0;
let isPYQ = false;

/* ----------------- PYQ MODE ----------------- */
document.getElementById("pyqBtn").addEventListener("click", () => {
  if (!data.pyq || data.pyq.length === 0) {
    alert("PYQ questions coming soon.");
    return;
  }

  isPYQ = true;
  subject = "pyq";
  questions = data.pyq;
  resetStats();

  document.getElementById("subjectSelect").style.display = "none";
  document.getElementById("backBtn").style.display = "block";
  document.getElementById("pyqBtn").style.display = "none";

  saveProgress();
  loadQuestion();
});

/* -------------- BACK TO SUBJECT ------------- */
document.getElementById("backBtn").addEventListener("click", () => {
  isPYQ = false;
  subject = "history";
  questions = data[subject] || [];
  resetStats();

  document.getElementById("subjectSelect").style.display = "block";
  document.getElementById("backBtn").style.display = "none";
  document.getElementById("pyqBtn").style.display = "block";

  saveProgress();
  loadQuestion();
});

/* ---------------- SUBJECT CHANGE ------------ */
document.getElementById("subjectSelect").addEventListener("change", () => {
  isPYQ = false;
  subject = subjectSelect.value;
  questions = data[subject] || [];
  resetStats();

  saveProgress();
  loadQuestion();
});

/* ----------------- TIMER -------------------- */
const timerInterval = setInterval(() => {
  time++;
  document.getElementById("timer").innerText = "⏱ " + time + "s";
  saveProgress();
}, 1000);

/* ---------------- SAVE / LOAD --------------- */
function saveProgress() {
  localStorage.setItem("sscQuizProgress", JSON.stringify({
    subject, current, score, time, attempted, wrong, isPYQ
  }));
}

function loadProgress() {
  const saved = localStorage.getItem("sscQuizProgress");
  if (!saved) return;

  const p = JSON.parse(saved);

  isPYQ = p.isPYQ;
  subject = p.subject || "history";
  questions = isPYQ ? (data.pyq || []) : (data[subject] || []);

  current = p.current || 0;
  score = p.score || 0;
  time = p.time || 0;
  attempted = p.attempted || 0;
  wrong = p.wrong || 0;

  document.getElementById("score").innerText = "Score: " + score;
  subjectSelect.value = subject;

  document.getElementById("subjectSelect").style.display = isPYQ ? "none" : "block";
  document.getElementById("backBtn").style.display = isPYQ ? "block" : "none";
  document.getElementById("pyqBtn").style.display = isPYQ ? "none" : "block";
}

/* ---------------- RESET --------------------- */
function resetStats() {
  current = 0;
  score = 0;
  time = 0;
  attempted = 0;
  wrong = 0;
  document.getElementById("score").innerText = "Score: 0";
}

/* ---------------- ANSWER -------------------- */
function checkAnswer(selected) {
  const q = questions[current];
  const buttons = document.querySelectorAll("#options button");

  buttons.forEach((btn, i) => {
    btn.disabled = true;
    if (i === q.answer) btn.style.background = "#c8e6c9";
    if (i === selected && i !== q.answer) btn.style.background = "#ffcdd2";
  });

  attempted++;
  if (selected === q.answer) {
    score++;
    feedback.innerText = "✅ Correct";
  } else {
    wrong++;
    feedback.innerText = "❌ Wrong";
  }

  solution.innerText = q.solution || "";
  scoreEl.innerText = "Score: " + score;
  nextBtn.style.display = "block";

  saveProgress();
}

/* ---------------- NEXT ---------------------- */
nextBtn.addEventListener("click", () => {
  current++;
  saveProgress();
  loadQuestion();
});

/* -------------- LOAD QUESTION --------------- */
function loadQuestion() {
  const optionsDiv = document.getElementById("options");
  optionsDiv.innerHTML = "";

  if (!Array.isArray(questions) || questions.length === 0) {
    question.innerText = "No questions available for this subject.";
    feedback.innerText = "";
    solution.innerText = "";
    nextBtn.style.display = "none";
    progressBar.style.width = "0%";
    return;
  }

  if (current >= questions.length) {
    alert("Quiz Completed 🎉");
    localStorage.removeItem("sscQuizProgress");
    location.reload();
    return;
  }

  const q = questions[current];
  question.innerText = (current + 1) + ". " + q.question;

  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.innerText = opt;
    btn.onclick = () => checkAnswer(i);
    optionsDiv.appendChild(btn);
  });

  feedback.innerText = "";
  solution.innerText = "";
  nextBtn.style.display = "none";
  progressBar.style.width = ((current + 1) / questions.length) * 100 + "%";
}

/* ---------------- START --------------------- */
loadProgress();
loadQuestion();
</script>

</body>
</html>
