<!DOCTYPE html>
<html>
<head>
  <title>SSC Quiz App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>

<div class="app">
  <h2>keep practicing keep smiling</h2>

  <button id="pyqBtn" class="pyq-btn">📜 PYQ MODE</button>
  <button id="backBtn" class="back-btn" style="display:none;">⬅ Back to Subjects</button>
  
<select id="subjectSelect">
  <option value="history">History</option>
  <option value="polity">Polity</option>
  <option value="geography">Geography</option>
  <option value="economy">Economy</option>
  <option value="science">Science</option>
  <option value="english">English (RC)</option>
</select>


  <div class="top-bar">
    <span id="timer">⏱ 0s</span>
    <span id="score">Score: 0</span>
  </div>

  <div class="progress">
    <div id="progress-bar"></div>
  </div>

  <p id="question"></p>
  <div id="options"></div>

  <div id="feedback"></div>
  <div id="solution"></div>

  <button id="nextBtn" style="display:none;">Next</button>
</div>

<script src="questions.js"></script>
<script>
/* ============ DOM ELEMENTS ============ */
const questionEl = document.getElementById("question");
const optionsEl = document.getElementById("options");
const feedbackEl = document.getElementById("feedback");
const solutionEl = document.getElementById("solution");
const nextBtn = document.getElementById("nextBtn");
const scoreEl = document.getElementById("score");
const timerEl = document.getElementById("timer");
const progressBar = document.getElementById("progress-bar");
const subjectSelect = document.getElementById("subjectSelect");

/* ============ STATE ============ */
let subject = "history";
let questions = data[subject] || [];
let current = 0;
let score = 0;
let time = 0;
let attempted = 0;
let wrong = 0;
let isPYQ = false;

/* ============ TIMER ============ */
setInterval(() => {
  time++;
  timerEl.innerText = "⏱ " + time + "s";
  saveProgress();
}, 1000);

/* ============ SAVE / LOAD ============ */
function saveProgress() {
  localStorage.setItem("sscQuizProgress", JSON.stringify({
    subject, current, score, time, attempted, wrong, isPYQ
  }));
}

function loadProgress() {
  const saved = localStorage.getItem("sscQuizProgress");
  if (!saved) return;

  const p = JSON.parse(saved);
  isPYQ = p.isPYQ;
  subject = p.subject || "history";
  questions = isPYQ ? data.pyq : data[subject];
  current = p.current || 0;
  score = p.score || 0;
  time = p.time || 0;
  attempted = p.attempted || 0;
  wrong = p.wrong || 0;

  scoreEl.innerText = "Score: " + score;
  subjectSelect.value = subject;
}

/* ============ RESET ============ */
function resetStats() {
  current = 0;
  score = 0;
  time = 0;
  attempted = 0;
  wrong = 0;
  scoreEl.innerText = "Score: 0";
}
/* ============ SUBJECT CHANGE ============ */
subjectSelect.addEventListener("change", () => {
  isPYQ = false;

  subject = subjectSelect.value;
  questions = data[subject] || [];

  resetStats();

  document.getElementById("pyqBtn").style.display = "block";
  document.getElementById("backBtn").style.display = "none";
  subjectSelect.style.display = "block";

  saveProgress();
  loadQuestion();
});
/* ============ PYQ MODE ============ */
document.getElementById("pyqBtn").addEventListener("click", () => {
  if (!data.pyq || data.pyq.length === 0) {
    alert("PYQ questions coming soon.");
    return;
  }

  isPYQ = true;
  subject = "pyq";
  questions = data.pyq;

  resetStats();

  subjectSelect.style.display = "none";
  document.getElementById("backBtn").style.display = "block";
  document.getElementById("pyqBtn").style.display = "none";

  saveProgress();
  loadQuestion();
});
/* ============ BACK TO SUBJECT MODE ============ */
document.getElementById("backBtn").addEventListener("click", () => {
  isPYQ = false;
  subject = "history";
  questions = data[subject] || [];

  resetStats();

  subjectSelect.style.display = "block";
  document.getElementById("backBtn").style.display = "none";
  document.getElementById("pyqBtn").style.display = "block";

  saveProgress();
  loadQuestion();
});

/* ============ ANSWER ============ */
function checkAnswer(selected) {
  const q = questions[current];
  const buttons = optionsEl.querySelectorAll("button");

  buttons.forEach((btn, i) => {
    btn.disabled = true;
    if (i === q.answer) btn.style.background = "#c8e6c9";
    if (i === selected && i !== q.answer) btn.style.background = "#ffcdd2";
  });

  attempted++;
  if (selected === q.answer) {
    score++;
    feedbackEl.innerText = "✅ Correct";
  } else {
    wrong++;
    feedbackEl.innerText = "❌ Wrong";
  }

  solutionEl.innerText = q.solution || "";
  scoreEl.innerText = "Score: " + score;
  nextBtn.style.display = "block";

  saveProgress();
}

/* ============ NEXT ============ */
nextBtn.addEventListener("click", () => {
  current++;
  saveProgress();
  loadQuestion();
});

/* ============ LOAD QUESTION ============ */
function loadQuestion() {
  optionsEl.innerHTML = "";
  nextBtn.style.display = "none";

  if (!questions || questions.length === 0) {
    questionEl.innerText = "No questions available.";
    return;
  }

  if (current >= questions.length) {
    alert("Quiz Completed 🎉");
    localStorage.removeItem("sscQuizProgress");
    location.reload();
    return;
  }

  const q = questions[current];
  questionEl.innerText = `${current + 1}. ${q.question}`;

  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.innerText = opt;
    btn.onclick = () => checkAnswer(i);
    optionsEl.appendChild(btn);
  });

  feedbackEl.innerText = "";
  solutionEl.innerText = "";
  progressBar.style.width = ((current + 1) / questions.length) * 100 + "%";
}

/* ============ START ============ */
loadProgress();
loadQuestion();
</script>


</body>
</html>
