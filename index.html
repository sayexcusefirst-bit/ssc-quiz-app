<!DOCTYPE html>
<html>
<head>
  <title>SSC Quiz App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>

<div class="app">
  <h2>SSC Daily Practice</h2>

  <select id="subjectSelect">
  <option value="history">History</option>
  <option value="polity">Polity</option>
  <option value="geography">Geography</option>
  <option value="economy">Economy</option>
  <option value="science">Science</option>
</select>
  
  <div class="top-bar">
    <span id="timer">⏱ 0s</span>
    <span id="score">Score: 0</span>
  </div>

  <div class="progress">
    <div id="progress-bar"></div>
  </div>

  <p id="question"></p>
  <div id="options"></div>

  <div id="feedback"></div>
  <div id="solution"></div>

  <button id="nextBtn">Next</button>
</div>

<script src="questions.js"></script>
<script>
let subject = "history";
let questions = data[subject];
let current = 0;
let score = 0;
let time = 0;
let timerStarted = false;

document.getElementById("subjectSelect").addEventListener("change", () => {
  subject = document.getElementById("subjectSelect").value;
  questions = data[subject];
  current = 0;
  score = 0;
  time = 0;
  document.getElementById("score").innerText = "Score: 0";
  loadQuestion();
});

setInterval(() => {
  time++;
  document.getElementById("timer").innerText = "⏱ " + time + "s";
}, 1000);

}

function checkAnswer(i) {
  const q = questions[current];
  if (i === q.answer) {
    score++;
    document.getElementById("feedback").innerText = "✅ Correct";
  } else {
    document.getElementById("feedback").innerText = "❌ Wrong";
  }
  document.getElementById("score").innerText = "Score: " + score;
  document.getElementById("solution").innerText = q.solution;
  document.getElementById("nextBtn").style.display = "block";
}

document.getElementById("nextBtn").addEventListener("click", () => {
  current++;
  if (current < questions.length) {
    loadQuestion();
  } else {
    document.querySelector(".app").innerHTML =
      `<h2>Quiz Completed 🎉</h2>
       <p>Final Score: ${score}/${questions.length}</p>
       <p>Total Time: ${time} seconds</p>`;
  }
});

function loadQuestion() {
  const optionsDiv = document.getElementById("options");

  // ✅ HANDLE EMPTY SUBJECTS PROPERLY
  if (!questions || questions.length === 0) {
    document.getElementById("question").innerText =
      "Questions coming soon for this subject.";
    optionsDiv.innerHTML = "";
    document.getElementById("feedback").innerText = "";
    document.getElementById("solution").innerText = "";
    document.getElementById("nextBtn").style.display = "none";
    document.getElementById("progress-bar").style.width = "0%";
    return;
  }

  document.getElementById("feedback").innerText = "";
  document.getElementById("solution").innerText = "";
  document.getElementById("nextBtn").style.display = "none";

  const q = questions[current];
  document.getElementById("question").innerText =
    (current + 1) + ". " + q.question;

  optionsDiv.innerHTML = "";

  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.innerText = opt;
    btn.onclick = () => checkAnswer(i);
    optionsDiv.appendChild(btn);
  });

  document.getElementById("progress-bar").style.width =
    ((current + 1) / questions.length) * 100 + "%";
}

</script>

</body>
</html>
