<!DOCTYPE html>
<html>
<head>
  <title>SSC Quiz App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>

<div class="app">
  <h2> keep practicing keep smiling </h2>
<button id="pyqBtn" class="pyq-btn">📜 PYQ MODE</button>

  <select id="subjectSelect">
    <option value="history">History</option>
    <option value="polity">Polity</option>
    <option value="geography">Geography</option>
    <option value="economy">Economy</option>
    <option value="science">Science</option>
  </select>

  <div class="top-bar">
    <span id="timer">⏱ 0s</span>
    <span id="score">Score: 0</span>
  </div>

  <div class="progress">
    <div id="progress-bar"></div>
  </div>

  <p id="question"></p>
  <div id="options"></div>

  <div id="feedback"></div>
  <div id="solution"></div>

  <button id="nextBtn">Next</button>
</div>

<script src="questions.js"></script>
<script src="questions.js"></script>
<script>
let subject = "history";
let questions = data[subject] || [];
let current = 0;
let score = 0;
let time = 0;
let isPYQ = false;

/* ---------- PYQ MODE ---------- */
const pyqBtn = document.getElementById("pyqBtn");
if (pyqBtn) {
  pyqBtn.addEventListener("click", () => {
    if (!data.pyq || data.pyq.length === 0) {
      alert("PYQ questions coming soon.");
      return;
    }

    isPYQ = true;
    subject = "pyq";
    questions = data.pyq;
    current = 0;
    score = 0;
    time = 0;

    document.getElementById("score").innerText = "Score: 0";
    document.getElementById("subjectSelect").style.display = "none";

    saveProgress();
    loadQuestion();
  });
}
/* -------------------------------- */

/* ---------- SAVE & LOAD PROGRESS ---------- */
function saveProgress() {
  localStorage.setItem(
    "sscQuizProgress",
    JSON.stringify({ subject, current, score, time, isPYQ })
  );
}

function loadProgress() {
  const saved = localStorage.getItem("sscQuizProgress");
  if (!saved) return;

  const progress = JSON.parse(saved);
  subject = progress.subject || "history";
  current = progress.current || 0;
  score = progress.score || 0;
  time = progress.time || 0;
  isPYQ = progress.isPYQ || false;

  questions = isPYQ ? data.pyq : data[subject] || [];

  document.getElementById("score").innerText = "Score: " + score;
  document.getElementById("subjectSelect").value = subject;
  document.getElementById("subjectSelect").style.display =
    isPYQ ? "none" : "block";
}
/* ---------------------------------------- */

/* ---------- SUBJECT CHANGE ---------- */
document.getElementById("subjectSelect").addEventListener("change", () => {
  isPYQ = false;
  subject = document.getElementById("subjectSelect").value;
  questions = data[subject] || [];
  current = 0;
  score = 0;
  time = 0;

  document.getElementById("score").innerText = "Score: 0";
  document.getElementById("subjectSelect").style.display = "block";

  saveProgress();
  loadQuestion();
});
/* ----------------------------------- */

/* ---------- TIMER ---------- */
setInterval(() => {
  time++;
  document.getElementById("timer").innerText = "⏱ " + time + "s";
  saveProgress();
}, 1000);
/* --------------------------- */

function checkAnswer(selectedIndex) {
  const q = questions[current];
  const optionsDiv = document.getElementById("options");
  const buttons = optionsDiv.querySelectorAll("button");

  buttons.forEach((btn, index) => {
    btn.disabled = true;
    if (index === q.answer) btn.style.backgroundColor = "#c8e6c9";
    if (index === selectedIndex && index !== q.answer)
      btn.style.backgroundColor = "#ffcdd2";
  });

  if (selectedIndex === q.answer) {
    score++;
    document.getElementById("feedback").innerText = "✅ Correct";
  } else {
    document.getElementById("feedback").innerText = "❌ Wrong";
  }

  document.getElementById("score").innerText = "Score: " + score;
  document.getElementById("solution").innerText = q.solution;
  document.getElementById("nextBtn").style.display = "block";

  saveProgress();
}

document.getElementById("nextBtn").addEventListener("click", () => {
  current++;
  saveProgress();

  if (current < questions.length) {
    loadQuestion();
  } else {
    document.querySelector(".app").innerHTML = `
      <h2>Quiz Completed 🎉</h2>
      <p>Final Score: ${score}/${questions.length}</p>
      <p>Total Time: ${time} seconds</p>`;
    localStorage.removeItem("sscQuizProgress");
  }
});

function loadQuestion() {
  const optionsDiv = document.getElementById("options");
  optionsDiv.innerHTML = "";

  if (!questions || questions.length === 0 || current >= questions.length) {
    document.getElementById("question").innerText =
      "Questions coming soon for this subject.";
    document.getElementById("feedback").innerText = "";
    document.getElementById("solution").innerText = "";
    document.getElementById("nextBtn").style.display = "none";
    document.getElementById("progress-bar").style.width = "0%";
    return;
  }

  document.getElementById("feedback").innerText = "";
  document.getElementById("solution").innerText = "";
  document.getElementById("nextBtn").style.display = "none";

  const q = questions[current];
  document.getElementById("question").innerText =
    (current + 1) + ". " + q.question;

  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.innerText = opt;
    btn.onclick = () => checkAnswer(i);
    optionsDiv.appendChild(btn);
  });

  document.getElementById("progress-bar").style.width =
    ((current + 1) / questions.length) * 100 + "%";
}

/* ---------- START APP ---------- */
loadProgress();
loadQuestion();
/* -------------------------------- */
</script>


</body>
</html>
