<!DOCTYPE html>
<html>
<head>
  <title>SSC Quiz App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>

<div class="app">
  <h2>keep practicing keep smiling</h2>

  <button id="pyqBtn" class="pyq-btn">📜 PYQ MODE</button>
  <button id="backBtn" class="back-btn" style="display:none;">⬅ Back to Subjects</button>
  
<select id="subjectSelect">
  <option value="history">History</option>
  <option value="polity">Polity</option>
  <option value="geography">Geography</option>
  <option value="economy">Economy</option>
  <option value="science">Science</option>
  <option value="english">English (RC)</option>
</select>


  <div class="top-bar">
    <span id="timer">⏱ 0s</span>
    <span id="score">Score: 0</span>
  </div>

  <div class="progress">
    <div id="progress-bar"></div>
  </div>

  <p id="question"></p>
  <div id="options"></div>

  <div id="feedback"></div>
  <div id="solution"></div>

  <button id="nextBtn" style="display:none;">Next</button>
</div>

<script>
/* ========= API FUNCTION ========= */
async function loadQuestionsFromAPI(subject) {
  const res = await fetch("https://ssc-quiz-app-production.up.railway.app/questions?subject=" + subject);
  return await res.json();
}

/* ============ DOM ELEMENTS ============ */
const questionEl = document.getElementById("question");
const optionsEl = document.getElementById("options");
const feedbackEl = document.getElementById("feedback");
const solutionEl = document.getElementById("solution");
const nextBtn = document.getElementById("nextBtn");
const scoreEl = document.getElementById("score");
const timerEl = document.getElementById("timer");
const progressBar = document.getElementById("progress-bar");
const subjectSelect = document.getElementById("subjectSelect");

/* ============ STATE ============ */
let subject = "history";
let questions = [];
let current = 0;
let score = 0;
let time = 0;

/* ============ TIMER ============ */
setInterval(() => {
  time++;
  timerEl.innerText = "⏱ " + time + "s";
}, 1000);

/* ============ LOAD QUESTIONS ============ */
async function startQuiz() {
  questionEl.innerText = "Loading questions...";
  
  try {
    questions = await loadQuestionsFromAPI(subject);
    current = 0;
    score = 0;
    scoreEl.innerText = "Score: 0";
    loadQuestion();
  } catch (e) {
    questionEl.innerText = "⚠️ Failed to load questions";
  }
}

/* ============ SUBJECT CHANGE ============ */
subjectSelect.addEventListener("change", async () => {
  subject = subjectSelect.value;
  startQuiz();
});

/* ============ ANSWER ============ */
function checkAnswer(selected) {
  const q = questions[current];
  const buttons = optionsEl.querySelectorAll("button");

  buttons.forEach((btn, i) => {
    btn.disabled = true;
    if (i === q.answer) btn.style.background = "#c8e6c9";
    if (i === selected && i !== q.answer) btn.style.background = "#ffcdd2";
  });

  if (selected === q.answer) {
    score++;
    feedbackEl.innerText = "✅ Correct";
  } else {
    feedbackEl.innerText = "❌ Wrong";
  }

  scoreEl.innerText = "Score: " + score;
  nextBtn.style.display = "block";
}

/* ============ NEXT ============ */
nextBtn.addEventListener("click", () => {
  current++;
  loadQuestion();
});

/* ============ LOAD QUESTION ============ */
function loadQuestion() {
  optionsEl.innerHTML = "";
  nextBtn.style.display = "none";

  if (!questions || questions.length === 0) {
    questionEl.innerText = "No questions available.";
    return;
  }

  if (current >= questions.length) {
    questionEl.innerText = "🎉 Quiz Completed!";
    return;
  }

  const q = questions[current];
  questionEl.innerText = `${current + 1}. ${q.question}`;

  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.innerText = opt;
    btn.onclick = () => checkAnswer(i);
    optionsEl.appendChild(btn);
  });

  feedbackEl.innerText = "";
  solutionEl.innerText = "";
  progressBar.style.width = ((current + 1) / questions.length) * 100 + "%";
}

/* ============ START ============ */
startQuiz();
</script>
</script>


</body>
</html>
